<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Responsable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF1EA; --ink: #24312B; --ink-soft: #5C6B5E; --rule: #C9D2C3;
    --accent: #2C4870; --accent-soft: #DCE3EE;
    --approved: #3B6146; --approved-bg: #DCEBDD;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'IBM Plex Sans', sans-serif; line-height: 1.5; }
  a { color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: baseline; max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 1rem; border-bottom: 1px solid var(--rule); }
  header h1 { font-family: 'Source Serif 4', serif; font-size: 1.4rem; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 1.25rem; font-size: 0.9rem; }
  main { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .greeting { font-family: 'Source Serif 4', serif; font-size: 1.8rem; margin: 0 0 0.4rem; }
  .subtext { color: var(--ink-soft); margin: 0 0 2rem; }
  .btn-primary {
    display: inline-block; padding: 0.65rem 1.2rem; border-radius: 3px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 500;
  }
  .btn-primary:hover { background: #223a5c; }
  .link-button { background: none; border: none; color: var(--accent); font-family: inherit; font-size: 0.9rem; cursor: pointer; padding: 0; }
</style>
</head>
<body>
<header>
  <h1>Gastos — Responsable</h1>
  <nav>
    <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
      {% csrf_token %}
      <button type="submit" class="link-button">Cerrar sesión</button>
    </form>
  </nav>
</header>
<main>
  <p class="greeting">Hola, {{ user.first_name|default:user.username }}</p>
  <p class="subtext">Revisá los gastos pendientes de aprobación de tu equipo.</p>
  <a class="btn-primary" href="{% url 'pending-expenses' %}">Ver gastos pendientes</a>
</main>
</body>
</html>
