<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis gastos</title>
</head>
<body>
    <h1>Mis gastos</h1>

    {% if expenses %}
      <ul>
        {% for expense in expenses %}
          <li>{{ expense.title }} — {{ expense.amount }} — {{ expense.get_status_display }}</li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No tenés gastos registrados</p>
    {% endif %}
</body>
</html>
