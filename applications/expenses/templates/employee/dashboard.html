<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel — Gastos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDF1EA;
    --paper-raised: #F5F8F3;
    --ink: #24312B;
    --ink-soft: #5C6B5E;
    --rule: #C9D2C3;
    --accent: #2C4870;
    --accent-soft: #DCE3EE;
    --approved: #3B6146; --approved-bg: #DCEBDD;
    --rejected: #8B3A2E; --rejected-bg: #F1DFDA;
    --pending: #96691E;  --pending-bg: #F1E4C9;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; line-height: 1.5;
  }
  a { color: var(--accent); }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 1rem;
    border-bottom: 1px solid var(--rule);
  }
  header h1 { font-family: 'Source Serif 4', serif; font-size: 1.4rem; margin: 0; font-weight: 600; }
  nav { display: flex; gap: 1.25rem; font-size: 0.9rem; }
  main { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .greeting { font-family: 'Source Serif 4', serif; font-size: 1.8rem; margin: 0 0 0.4rem; }
  .subtext { color: var(--ink-soft); margin: 0 0 2rem; }
  .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 0.65rem 1.2rem; border-radius: 3px;
    text-decoration: none; font-weight: 500; font-size: 0.95rem;
    border: 1px solid transparent; cursor: pointer; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #223a5c; }
  .btn-secondary { background: transparent; color: var(--accent); border-color: var(--accent); }
  .btn-secondary:hover { background: var(--accent-soft); }
  .link-button {
    background: none; border: none; color: var(--accent); font-family: inherit;
    font-size: 0.9rem; cursor: pointer; padding: 0;
  }
  .link-button:hover { text-decoration: underline; }
  .messages { list-style: none; padding: 0; margin: 0 0 1.5rem; }
  .messages li {
    background: var(--approved-bg); color: var(--approved); border-left: 3px solid var(--approved);
    padding: 0.7rem 1rem; border-radius: 2px; font-size: 0.92rem;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Gastos — Empleado</h1>
  <nav>
    <a href="{% url 'expense-list' %}">Mis gastos</a>
    <form method="post" action="{% url 'logout' %}" style="display:inline; margin:0;">
      {% csrf_token %}
      <button type="submit" class="link-button">Cerrar sesión</button>
    </form>
  </nav>
</header>
<main>
  {% if messages %}
    <ul class="messages" id="messages">
      {% for message in messages %}<li>{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}

  <p class="greeting">Hola, {{ user.first_name|default:user.username }}</p>
  <p class="subtext">Registrá un gasto nuevo o revisá el estado de los que ya enviaste.</p>

  <div class="actions">
    <a class="btn btn-primary" href="{% url 'expense-create' %}">Registrar gasto</a>
    <a class="btn btn-secondary" href="{% url 'expense-list' %}">Ver mis gastos</a>
  </div>
</main>
<script>
  const msgs = document.getElementById('messages');
  if (msgs) { setTimeout(() => { msgs.style.opacity = '0'; msgs.style.transition = 'opacity .6s'; }, 4000); }
</script>
</body>
</html>
